[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Header() defaults are the framework's own idiom.
# UP042: str+Enum keeps the values JSON- and SQLAlchemy-friendly across versions.
ignore = ["B008", "UP042"]
