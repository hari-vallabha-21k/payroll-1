[project]
name = "payroll-attendance"
version = "1.0.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Header() defaults are the framework's own idiom.
# UP042: str+Enum keeps the values JSON- and SQLAlchemy-friendly across versions.
ignore = ["B008", "UP042"]

[tool.black]
line-length = 100
target-version = ["py310"]
